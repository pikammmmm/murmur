# keyd config for murmur's push-to-talk.  Install as /etc/keyd/default.conf
#
#   sudo install -Dm644 ~/murmur/linux/keyd-murmur.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
#
# Trigger: hold BARE backslash to dictate; tap it to type a `\` as normal.
# Same single key as the Windows build, so the muscle memory carries over.
#
# Why keyd rather than the XDG GlobalShortcuts portal:
#
#   * The portal's grab is by KEY, not by device, so a bare printable trigger
#     such as `backslash` is swallowed everywhere, and re-injecting the
#     character on a tap does not compensate: the injected keystroke is grabbed
#     identically (measured -- a Qt input field stayed empty) and re-enters as
#     another tap.
#   * Binding a combination like Meta+backslash sidesteps that but leaks a stray
#     `\`. The grab matches the combination, so releasing Meta a fraction before
#     the still-held `\` stops it matching while the key is physically down, and
#     the bare key reaches the focused window. Intermittent, decided by which
#     finger lifts first.
#
# keyd sits below the compositor: it grabs the physical keyboard and re-emits
# through its own virtual device, so it resolves tap-vs-hold before anything
# else sees the key. That is what makes a bare printable trigger possible at
# all -- the character is withheld until keyd knows which one it was.
#
# The `dictate` layer is deliberately EMPTY. It emits nothing and exists only so
# its activation is observable through `keyd listen`, which
# linux/murmur-keyd-ptt.py watches. Emitting a spare key here instead would put
# us back to needing a grab somewhere.

[ids]

*
# ydotoold's virtual keyboard, which is how the sidecar types the transcript
# (see sidecar/murmur_sidecar/backends/linux.py). keyd matches it under a bare
# `*` because it is a uinput device like any other, which would put murmur's own
# output back through this config: an injected `\` would be withheld pending a
# tap-vs-hold decision, and keyd's modifier guard would wrap the paste chord in
# extra control presses. Neither is wanted -- only the physical keyboard should
# drive the trigger.
-2333:6666

[global]

# Suppress the tap `\` once the key has been held this long, so finishing a
# dictation does not spit a backslash into the field murmur is about to type
# the transcript into. Without this, overload() emits the tap on *every*
# release, however long the hold.
#
# Must be <= the shell's hotkey.hold_threshold_ms (350, see src-tauri/src/
# config.rs) and never above it. Below: a hold that lands between the two
# timeouts does nothing at all, which is silent and harmless. Above: that same
# band both records AND types a stray `\`, which is not. Equal is the tightest
# safe setting -- the shell polls on a 20 ms tick, so its effective threshold is
# already a fraction higher, leaving the ordering correct without a dead band
# wide enough to notice.
overload_tap_timeout = 350

[main]

# overload() enters the layer on key *down*, so the shell starts its own hold
# timer immediately and there is no added latency before recording begins --
# unlike overloadt(), which would withhold the layer for the full timeout and
# stack that delay on top of the shell's 350 ms.
#
# The cost of tap-on-release: held `\` no longer auto-repeats. The Windows build
# had the same tradeoff.
backslash = overload(dictate, backslash)

[dictate]
