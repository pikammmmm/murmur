# keyd config for murmur's push-to-talk.  Install as /etc/keyd/default.conf
#
#   sudo install -Dm644 ~/murmur/linux/keyd-murmur.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
#
# Trigger: hold left Ctrl + Super + Alt together. All three sit in the
# bottom-left cluster, so it is a one-hand hold.
#
# Why keyd rather than the XDG GlobalShortcuts portal:
#
#   * The portal refuses a modifier-only trigger -- global shortcuts there need
#     a non-modifier key.
#   * Its grab is by KEY, not by device, so a bare printable trigger such as
#     `backslash` is swallowed everywhere, and re-injecting the character on a
#     tap does not compensate: the injected keystroke is grabbed identically
#     (measured -- a Qt input field stayed empty) and re-enters as another tap.
#   * Binding a combination like Meta+backslash leaks a stray `\`. The grab
#     matches the combination, so releasing Meta a fraction before the
#     still-held `\` stops it matching while the key is physically down, and the
#     bare key reaches the focused window. Intermittent, decided by which finger
#     lifts first.
#
# keyd sits below the compositor: it grabs the physical keyboard and re-emits
# through its own virtual device, so it resolves the chord before anything else
# sees the keys.
#
# A modifier-only chord also sidesteps the whole tap-vs-hold problem -- there is
# no character to preserve, so no timer and no synthesised keystroke. While the
# chord is held those three keys do not act as modifiers; individually they are
# untouched.
#
# The `dictate` layer is deliberately EMPTY. It emits nothing and exists only so
# its activation is observable through `keyd listen`, which
# linux/murmur-keyd-ptt.py watches. Emitting a spare key here instead would put
# us back to needing a grab somewhere.

[ids]

*

[main]

leftcontrol+leftmeta+leftalt = layer(dictate)

[dictate]
