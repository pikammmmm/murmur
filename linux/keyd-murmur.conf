# keyd config for murmur's push-to-talk.  Install as /etc/keyd/default.conf
#
#   sudo install -Dm644 ~/murmur/linux/keyd-murmur.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
#
# Why this exists at all: the XDG GlobalShortcuts portal cannot give us
# "tap types the character, hold dictates" on a bare key. Its grab is by KEY and
# not by device, so a bare printable trigger is swallowed everywhere and the
# character we re-inject to compensate is swallowed too (tested: a Qt field
# stayed empty). Binding Meta+backslash avoids that but leaks a stray `\`
# whenever Meta is released a moment before the still-held `\`, because the
# combination stops matching while the key is physically down.
#
# keyd sits below the compositor: it grabs the physical keyboard and re-emits
# through its own virtual device, so it can decide tap-vs-hold before anything
# else ever sees the key. Nothing is emitted while held, which is what removes
# the stray character.
#
# overloadt2(layer, key, ms): held past ms -> activate `layer`; released before
# -> emit `key`. The t2 variant resolves on the timer alone, so a hold with no
# other key pressed still triggers -- plain overload() waits for an interrupting
# keypress, which never comes when you are just holding a key to talk.
#
# The `dictate` layer is deliberately EMPTY. It emits nothing; it exists only so
# that its activation is observable via `keyd listen`, which murmur's
# linux/murmur-keyd-ptt.py watches. Emitting a spare key here instead would put
# us back to needing a grab somewhere.

[ids]

*

[main]

backslash = overloadt2(dictate, backslash, 350)

[dictate]
